#
# Restic backup of ns8-postgresql19c. state/environment is always included.
#
# - postgresql.dump: pg_dumpall of the primary (a marker on replicas and
#   witnesses), written by bin/module-dump-state
# - secrets.env: local copy of the PostgreSQL, Patroni and pgAdmin
#   passwords (SecretManager local backend, 0600). With OpenBao on, it is
#   the cache that lets a restore work without OpenBao
# - secrets/clients: consumer credentials copied from OpenBao by
#   copy-openbao-to-local, if any
# - pgadmin-data: pgAdmin settings
#
# Not included: the PostgreSQL and etcd volumes (the dump replaces them),
# the CA (a restored instance gets a new one), the OpenBao token, the peer
# approvals, and the rendered configuration.
state/postgresql.dump
state/secrets.env
state/secrets/clients
volumes/pgadmin-data
